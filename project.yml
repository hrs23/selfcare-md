name: SelfcareMD
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  SelfcareCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 7L3M83VR52
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SelfcareMD:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources/Assets.xcassets
      - path: App/Resources/Packs
        type: folder
        buildPhase: resources
    dependencies:
      - package: SelfcareCore
    entitlements:
      path: App/SelfcareMD.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: selfcare.md
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSHealthShareUsageDescription: Import your records from Apple Health into your daily pages.
        NSHealthUpdateUsageDescription: Save timer workouts to Apple Health.
        NSCameraUsageDescription: Scan a QR code to set up sync.
        NSLocalNetworkUsageDescription: Connect to servers on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.selfbase.selfcaremd
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Debug OpenAI key
        basedOnDependencyAnalysis: false
        script: |
          KEY=""
          if [ "$CONFIGURATION" = "Debug" ]; then
            KEY="${DEBUG_OPENAI_API_KEY:-}"
            FILE="$HOME/.config/selfcare-md/debug-openai-key"
            if [ -z "$KEY" ] && [ -f "$FILE" ]; then KEY="$(tr -d '\n\r ' < "$FILE")"; fi
          fi
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          [ -f "$PLIST" ] || exit 0
          /usr/libexec/PlistBuddy -c "Delete :SelfcareDebugOpenAIKey" "$PLIST" >/dev/null 2>&1 || true
          if [ -n "$KEY" ]; then
            /usr/libexec/PlistBuddy -c "Add :SelfcareDebugOpenAIKey string $KEY" "$PLIST"
          fi
